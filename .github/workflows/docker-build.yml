name: dockertest
on:
  push:
  pull_request:

jobs:
  dockertest:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/s390x
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Checkout mock
        uses: actions/checkout@v4
        with:
          path: mock
          fetch-depth: 0
      - name: Build new image with mock in it and Load it into Docker for testing
        uses: docker/build-push-action@v6
        with:
          tags: mockenv:latest
          file: mock/.github/workflows/Dockerfile
          context: .
          pull: true
          push: false
          load: true

      - name: Enable kvm for nested virtualization and run guest
        run: |
          sudo usermod -G libvirt $USER
          sudo -E bash -C 'exec su -l '$USER
          docker run --platform linux/s390x --privileged --cap-add=SYS_ADMIN -t --rm mockenv:latest sh -c "mock --root /etc/mock/fedora-rawhide-s390x.cfg --shell echo hello world"
